plugins {
    id "com.github.johnrengelman.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    modApi "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionFabric")

    // XP Obelisk (base mod). Not bundled: it is a required dependency the player installs.
    modImplementation files("../depend/xp_obelisk-fabric-${rootProject.xp_obelisk_version}.jar")

    modCompileOnly "vazkii.patchouli:Patchouli:$rootProject.patchouli_version-FABRIC"
    // Patchouli in the dev client so the handbook can be tested (not bundled)
    modLocalRuntime "vazkii.patchouli:Patchouli:$rootProject.patchouli_version-FABRIC"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
}

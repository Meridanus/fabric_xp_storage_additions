plugins {
    id "com.github.johnrengelman.shadow"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modApi "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionNeoForge")

    // XP Obelisk (base mod). Not bundled: it is a required dependency the player installs.
    modImplementation files("../depend/xp_obelisk-neoforge-${rootProject.xp_obelisk_version}.jar")

    modCompileOnly "vazkii.patchouli:Patchouli:$rootProject.patchouli_version-NEOFORGE"
    // Patchouli in the dev client so the handbook can be tested (not bundled)
    modLocalRuntime "vazkii.patchouli:Patchouli:$rootProject.patchouli_version-NEOFORGE"
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
}
